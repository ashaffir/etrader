# =====================================================================
# etrader — autonomous trading-bot configuration
# =====================================================================
# All trading credentials live in `.env`; this file holds *behavior*
# defaults: guardrails, operations, universe selection, AI tuning.
# Every field has a safe default — you can delete sections you don't
# want to change.

# ---------------------------------------------------------------------
# [mode] paper vs. live
# ---------------------------------------------------------------------
# - "paper" → uses the eToro **demo** environment (fake money, real
#   prices). Always safe.
# - "live"  → uses the eToro **real** environment. Requires
#   `ALLOW_REAL=true` AND a populated `REAL_USER_KEY` in `.env`. The
#   bot will refuse to start otherwise.
[mode]
trading = "paper"

# ---------------------------------------------------------------------
# [guardrails] hard limits applied before every trade
# ---------------------------------------------------------------------
[guardrails]
max_per_trade_usd          = 500.0   # max cash committed per single open
max_parallel_trades        = 10      # max simultaneous open positions opened by this bot
# Total USD the bot may have invested across ALL of its own open
# positions at any one time. Counts only bot-owned positions — manual
# / mirror positions are ignored. 0 disables the cap. When a new BUY
# would push the bot over the cap, the risk layer first tries to
# amend the BUY down to whatever headroom is left; if the headroom
# is below `min_amend_remainder_usd`, the BUY is rejected entirely.
max_bot_invested_usd       = 2000.0
min_amend_remainder_usd    = 50.0    # floor under which budget-amended BUYs are rejected, not shrunk further
daily_loss_stop_usd        = 0.0     # 0 = disabled (always-on mode); set >0 to halt new opens if today's drawdown ≥ this vs. session start
pre_earnings_buy_blackout_hours = 0  # 0 = disabled; >0 = refuse BUYs for any non-crypto name with earnings within this many hours (needs [earnings_calendar] enabled = true)
per_instrument_cooldown_min = 60     # after closing/opening on an instrument, ignore it for N minutes
default_stop_loss_pct      = 5.0     # SL distance from entry (% of entry price)
default_take_profit_pct    = 8.0     # TP distance from entry (% of entry price)
max_leverage               = 1       # default leverage; the bot never sends > 1 unless this is raised

# ---------------------------------------------------------------------
# [position_review] threshold-triggered review of open bot positions
# ---------------------------------------------------------------------
# Every cycle the bot pre-screens each of its own open positions
# against these triggers. A position that fires ≥1 trigger gets a
# `review.triggers` annotation in the LLM payload, and the manager
# is REQUIRED to respond with CLOSE (full or partial), MODIFY_STOPS
# (tighten / loosen SL/TP, possibly add a trailing band), or HOLD with
# an explicit rationale.
#
# Set any value to 0 to disable that trigger. All percentages are
# positive numbers (5.0 = 5%).
[position_review]
drawdown_pct           = 2.0    # close-or-explain when P/L ≤ -X% of entry
pullback_pct           = 3.0    # close-or-explain when position gave back ≥ X% of peak P/L
stale_hold_minutes     = 60.0   # consider a position "stale" after this long
stale_threshold_pct    = 0.5    # …if |P/L| < this % when the stale timer expires
max_hold_minutes       = 240.0  # hard ceiling on how long the bot may hold any single position

# ---------------------------------------------------------------------
# [operations] cycle timing + market-data shape
# ---------------------------------------------------------------------
[operations]
check_interval_seconds   = 60        # how often the main loop runs
universe_refresh_minutes = 30        # rebuild tracked-symbol set every N minutes
candle_interval          = "OneHour" # OneMinute | FiveMinutes | FifteenMinutes | OneHour | FourHours | OneDay
candle_count             = 100       # candles per instrument fetched per cycle (max 1000)
request_timeout_seconds  = 20
trade_spacing_seconds    = 3         # min spacing between trade-execution calls (eToro caps at 20 req/min)
# Stuck-order auto-cancel: if an order placed by the bot is still
# pending after the market for that asset has been open for this many
# seconds, the bot cancels it via DELETE. A Telegram alert is sent
# ONLY if the cancel itself is refused and the order is still
# genuinely unsettled (i.e. operator intervention is required). 0
# disables the grace floor entirely (don't recommend).
pending_grace_seconds_after_open = 300
# Master switch for the stuck-order cancel pipeline.
cancel_stuck_orders_enabled      = true

# ---------------------------------------------------------------------
# [universe] which instruments to track
# ---------------------------------------------------------------------
# Phase 2: news-driven. The universe is built every
# `operations.universe_refresh_minutes` from the news candidate store
# (see [news] below). Each candidate is probed for trading activity
# (volatility + spread) before being admitted to the tracked set.
#
# `base_symbols` accepts plain US tickers (``AAPL``, ``NVDA``) AND
# exchange-suffixed foreign tickers (``VOD.L``, ``ASML.AS``,
# ``SAP.DE``, ``7203.T``, ``0700.HK``, ``BHP.AX``, …). The resolver
# searches eToro's instrument catalogue, so any name eToro lists is
# reachable. Seeds still pass through the activity filter.
#
# A starter cross-region list is provided below. The bot is only as
# multi-market as the universe lets it be — once `base_symbols` has
# foreign names, the LLM rotation, the activity filter, and the
# decision LLM all start receiving them, and your bot can finally
# trade outside US hours.
#
# `enable_llm_rotation` is kept as a *fallback* (used only when news
# yields fewer than max_tracked passing candidates and the LLM is
# configured). Symbols are resolved to instrument IDs once and
# cached in `data/instrument_cache.json`.
[universe]
base_symbols          = [
    # --- US large caps (pre-resolved in instrument_cache.json) ---
    "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META",
    # --- UK (London Stock Exchange) ---
    "VOD.L", "BP.L", "HSBA.L", "AZN.L", "SHEL.L", "GSK.L",
    # --- Continental Europe ---
    "ASML.AS",   # Amsterdam
    "SAP.DE", "SIE.DE", "ALV.DE",  # XETRA
    "MC.PA", "TTE.PA",  # Euronext Paris
    # --- Asia ---
    "7203.T", "6758.T",  # Toyota, Sony — Tokyo
    "0700.HK", "9988.HK",  # Tencent, Alibaba — Hong Kong
    # --- Australia ---
    "BHP.AX", "CBA.AX",
    # --- Crypto (24/7) ---
    "BTC", "ETH", "SOL",
]
max_tracked           = 25
enable_llm_rotation   = true

# Activity-filter knobs. A candidate is rejected from the tracked
# universe when its ATR% is below `min_atr_pct` (too flat to trade)
# or its eToro spread exceeds `max_spread_pct` (cost-to-trade too
# high). `probe_max_candidates` caps how many news candidates the
# builder will probe per refresh (top N by score).
min_atr_pct           = 0.3
max_spread_pct        = 1.0
atr_period            = 14
activity_min_candles  = 20
probe_max_candidates  = 50

# ---------------------------------------------------------------------
# [news] news-driven universe discovery (phase 1)
# ---------------------------------------------------------------------
# The aggregator runs every `scan_interval_minutes` and folds new
# observations into `data/news_candidates.json`. Each candidate ages
# out after `ttl_hours` of no new mentions. `enabled_sources` selects
# the plug-ins to activate:
#
#   - "stocktwits"          → trending tickers (no key, no rate limit) — US-leaning
#   - "sec_edgar"           → 8-K material-event filings (US-listed only)
#   - "google_news"         → US-edition broad finance RSS, rotating queries
#   - "google_news_regional"→ UK/DE/FR/JP/HK/AU editions of Google News (one
#                             feed per region) — required for non-US ticker
#                             nominations; pair it with the foreign seeds in
#                             [universe].base_symbols so the ticker extractor
#                             has the right vocab.
#   - "yahoo_rss"           → per-ticker headlines, enrichment for tracked symbols
#   - "yfinance"            → per-ticker news + co-mentioned `relatedTickers`
#
# Per-source caps below keep API usage modest. Phase 2 wires the
# universe builder to consume the candidate store; for phase 1 these
# settings only affect the news pipeline itself.
[news]
enabled                          = true
scan_interval_minutes            = 60
ttl_hours                        = 24
candidate_store_path             = "data/news_candidates.json"
half_life_hours                  = 6.0
enabled_sources                  = [
    "stocktwits", "sec_edgar",
    "google_news", "google_news_regional",
    "yahoo_rss", "yfinance",
]
google_news_max_items_per_query  = 25
yahoo_rss_max_symbols            = 50
yahoo_rss_max_items_per_symbol   = 10
yfinance_max_symbols             = 50
yfinance_max_items_per_symbol    = 10
sec_edgar_cik_cache_path         = "data/sec_cik_to_ticker.json"

# ---------------------------------------------------------------------
# [fundamentals] yfinance-backed per-symbol valuation cache (phase 3)
# ---------------------------------------------------------------------
# On every universe refresh the bot tops up a small JSON cache with
# fundamentals (sector, P/E, margins, growth, analyst targets, ...)
# for the tracked tickers. Entries are re-fetched after
# `refresh_after_hours` or as soon as their recorded next-earnings
# timestamp passes. `budget_per_refresh` caps how many *stale* tickers
# we'll re-fetch in a single cycle so a 50-ticker universe doesn't
# block the loop on 50 sequential yfinance calls.
#
# `enrich_decision_prompt = true` appends a trim fundamentals dict
# to each candidate in the LLM decision prompt; switch to false to
# keep the cache populated without paying the token cost.
[fundamentals]
enabled                  = true
cache_path               = "data/fundamentals_cache.json"
refresh_after_hours      = 24.0
failure_backoff_hours    = 6.0
budget_per_refresh       = 8
enrich_decision_prompt   = true

# ---------------------------------------------------------------------
# [earnings_calendar] yfinance-backed next-earnings cache
# ---------------------------------------------------------------------
# Free data. When enabled, every tracked symbol gets its next
# scheduled earnings date refreshed from yfinance (with a TTL so we
# don't hammer Yahoo). The data flows into:
#   * candidates: ``tools.features.hours_to_earnings``
#   * open positions: ``earnings.{hours_to,days_to,next_earnings_utc}``
#   * the optional ``pre_earnings_buy_blackout_hours`` guardrail
#   * the optional ``pre_earnings_close_hours`` directive
# The feature is DISABLED by default — flip ``enabled`` to opt in.
[earnings_calendar]
enabled            = false
cache_path         = "data/earnings_cache.json"
ttl_hours          = 12.0
budget_per_refresh = 6

# ---------------------------------------------------------------------
# [strategy] price-tool ensemble (entry / exit candidacy)
# ---------------------------------------------------------------------
# Every enabled price tool emits a signed score in [-1, +1]; the
# weighted average across all of them is the ensemble's raw_score.
#   raw_score >= min_signal_strength   → BUY candidate (unowned)
#   raw_score <= -min_exit_strength    → CLOSE candidate (bot-owned)
# Set any weight to 0.0 to disable that tool's contribution to
# candidacy without removing it from the downstream tool catalog.
[strategy]
sma_short_period      = 10
sma_long_period       = 30
ema_fast_period       = 12
ema_slow_period       = 26
rsi_period            = 14
rsi_oversold          = 30.0
rsi_overbought        = 70.0
macd_fast             = 12
macd_slow             = 26
macd_signal           = 9
bollinger_period      = 20
bollinger_stddev      = 2.0
donchian_period       = 20
momentum_lookback     = 10
min_signal_strength   = 0.40     # min positive ensemble for BUY (calibrated)
min_exit_strength     = 0.25     # min negative ensemble for CLOSE (lower bar — exit fast)
weight_sma_cross      = 1.0
weight_ema_cross      = 0.8
weight_rsi            = 0.6
weight_macd           = 1.0
weight_bollinger      = 0.7
weight_donchian       = 0.9
weight_momentum       = 0.7

# ---------------------------------------------------------------------
# [tools] extended signal catalog + selector tuning
# ---------------------------------------------------------------------
# The bot ships with ~18 named tools (price/volume/context). The
# selector picks a relevant subset per (instrument, cycle) using:
#   1. asset-class compatibility (e.g. FX skips volume tools);
#   2. live regime detection (trending vs ranging) per instrument;
#   3. rolling per-tool hit-rate persisted to `performance_log_path`.
[tools]
enabled                 = true
max_tools_per_cycle     = 14    # selector budget per (instrument, cycle)
min_hit_rate            = 0.40  # demote a tool when rolling hit-rate dips below this
min_observations        = 30    # minimum samples before perf demotion kicks in
feed_enabled            = true
feed_take               = 20    # number of feed posts to fetch per instrument
feed_cache_ttl_seconds  = 600   # cache feed responses for 10 min
regime_anchors          = ["SPX500", "BTC"]
higher_tf_interval      = "OneDay"
higher_tf_count         = 120
performance_log_path    = "data/tool_performance.jsonl"
spread_max_pct          = 0.5   # spread_filter gate caps BUYs above this %

# ---------------------------------------------------------------------
# [ai] Azure Foundry / OpenAI behaviour
# ---------------------------------------------------------------------
# Reads endpoint/key/deployment from .env. Toggle `enabled = false`
# to fall back to deterministic-only signals.
[ai]
enabled                  = true
max_completion_tokens    = 4000
veto_on_unavailable      = true      # if AI call fails, skip placing new trades this cycle
decision_lookback_candles = 30

# ---------------------------------------------------------------------
# [logging] output formatting
# ---------------------------------------------------------------------
[logging]
level         = "INFO"               # DEBUG | INFO | WARNING | ERROR
file          = "logs/trader.log"
max_bytes     = 10485760             # 10 MB
backup_count  = 5
color_stdout  = true

# ---------------------------------------------------------------------
# [control] internal HTTP control API for the Telegram service
# ---------------------------------------------------------------------
# When `enabled = true` the trading bot starts a tiny HTTP server on
# `host:port` that the Telegram service (or any trusted in-network
# caller) uses to read status, request /pause /resume /panic, edit
# guardrails, and forward free-text questions to the LLM. Auth is the
# `INTERNAL_API_TOKEN` env var (Bearer token); requests without it are
# rejected. Bind to 127.0.0.1 unless you run the Telegram service on a
# different host on a private network.
[control]
enabled = true
host    = "127.0.0.1"
port    = 8770

# ---------------------------------------------------------------------
# [alerting] Telegram push-style alerts
# ---------------------------------------------------------------------
# Per-chat alert toggles for trade outcomes, kill-switch fires, AI
# availability flips, etc. Allowed chats are taken from
# `TELEGRAM_ALLOWED_CHAT_IDS` (.env), so the trading bot and Telegram
# service share one allow-list. Use `/alerts` from Telegram to toggle.
# Subscriptions persist to `data/alert_subscriptions.json`. New chats
# default to safety-only alerts (panic_close, daily_loss_halt,
# cycle_error, trade_failed); opt in to the trade-by-trade ones.
[alerting]
max_queue_per_chat   = 200                              # cap pending alerts per chat (oldest dropped beyond this)
subscriptions_file   = "data/alert_subscriptions.json"
